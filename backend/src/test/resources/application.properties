# Default application properties for all tests
# IMPORTANT: Profile-specific overrides come from @ActiveProfiles or -Dspring.profiles.active

# Base datasource — will be overridden by application-test.properties or application-it.properties
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT
versus.jwt.secret=test-secret-test-secret-test-secret-test-secret-test-secret-test-secret-aaaa
versus.jwt.access-expiry=900
versus.jwt.refresh-expiry=604800

# Seeding
versus.seed.enabled=false

# Storage
versus.storage.provider=local
versus.storage.local-root=target/test-storage

# JMX
spring.jmx.enabled=false

# Logging
logging.level.root=WARN
logging.level.com.versus=INFO