# =========================
# UNIT TEST PROFILE
# =========================

# H2 en memoria (rápido y aislado para unit tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL;TRACE_LEVEL_SYSTEM_OUT=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# DDL auto para unit tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Desactivar seeding automático
versus.seed.enabled=false

# JWT para tests
versus.jwt.secret=test-secret-test-secret-test-secret-test-secret-very-long-for-h256
versus.jwt.access-expiry=900
versus.jwt.refresh-expiry=604800

# Storage local seguro
versus.storage.provider=local
versus.storage.local-root=target/test-storage
versus.storage.public-path=/media-files/
versus.storage.public-base-url=

# Lazy init para acelerar tests
spring.main.lazy-initialization=false

# Deshabilitar jmx en tests
spring.jmx.enabled=false

# Logging minimal para tests
logging.level.root=WARN
logging.level.com.versus=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.hibernate=WARN

# WebSocket/STOMP básico
server.servlet.context-path=/
spring.webflux.base-path=/

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# No registros de health detallados en tests
spring.boot.logging.level.org.springframework.boot.actuate=WARN